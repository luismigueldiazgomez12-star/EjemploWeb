<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8" />
        <title>Formulario</title>
        <link rel="stylesheet" href="css/estilo.css">
    </head>

    <body>
        <header>
            <nav>
                <a class="BOTON" href="index.html">Inicio</a>
                <a class="BOTON" href="horario.html">Horario</a>
                <a class="BOTON" href ="formulario.html">Formulario</a>
            </nav>
        </header>

        <main>
            <form>
                <fieldset>
                    <legend class="LEGEND">Formulario de Contacto</legend>
                        
                        <p>
                            <label for="nombre">Nombre:</label>
                            <input type="text" id="nombre" name="nombre" required />
                        </p>
                        <p>
                            <label for="apellidos">Apellidos:</label>
                            <input type="text" id="apellidos" name="apellidos" required />
                        </p>
                        <p>
                            <label for="DNI">DNI:</label>
                            <input type="text" id="DNI" name="DNI" required />
                        </p>
                        <p>
                            <label for="contacto">Contacto:</label>
                            <input type="text" id="contacto" name="contacto" required />
                        </p>
                        <p>
                            <label for="correo">Correo Electrónico:</label>
                            <input type="email" id="correo" name="correo" required />
                        </p>
                        <p>
                            <label for="telefóno">Teléfono:</label>
                            <input type="text" id="telefóno" name="telefóno" required />
                        </p>
                        <p>
                            <label for="Fecha de Nacimiento">Fecha de Nacimiento:</label>
                            <input type="date" id="Fecha de Nacimiento" name="Fecha de Nacimiento" required />
                        </p>
                        <p>
                            <label for="Página Web">Página Web:</label>
                            <input type="text" id="Página Web" name="Página Web" required />
                        </p>
                        <p>
                        <input type="submit" id="Enviar Formulario" name="Enviar Formulario" required />
                        <input type="reset" id="Borrar Formulario" name="Borrar Formulario" required />          
                        </p>         
                </fieldset>
            </form>
        </main>

        <footer>
            <p class="FOOT">CIFP Virgen de Gracia</p>
            <p class="FOOT">Contacto:
            <a class="CORREOS" href="https://www.cifpvirgendegracia.com/">https://www.cifpvirgendegracia.com/</a>
            </p>
        </footer>
    </body>
</html>
