    <main class="contenedor-calculadora">
        <table class="calculadora">
            <tr>
                <td colspan="4">
                    <input type="text" id="pantalla" readonly placeholder="0">
                </td>
            </tr>
            <tr>
                <td><input type="button" onclick="escribir(7)" value="7"></td>
                <td><input type="button" onclick="escribir(8)" value="8"></td>
                <td><input type="button" onclick="escribir(9)" value="9"></td>
                <td><input type="button" onclick="escribir('/')" value="/" class="operador"></td>
            </tr>
            <tr>
                <td><input type="button" onclick="escribir(4)" value="4"></td>
                <td><input type="button" onclick="escribir(5)" value="5"></td>
                <td><input type="button" onclick="escribir(6)"value="6"></td>
                <td><input type="button" value="*" class="operador" onclick="escribir('*')"></td>
            </tr>
            <tr>
                <td><input type="button" value="1" onclick="escribir(1)"></td>
                <td><input type="button" value="2" onclick="escribir(2)"></td>
                <td><input type="button" value="3" onclick="escribir(3)"></td>
                <td><input type="button" value="-" class="operador" onclick="escribir('-')"></td>
            </tr>
            <tr>
                <td><input type="button" value="0" onclick="escribir(0)"></td>
                <td><input type="button" value="." onclick="escribir('.')"></td>
                <td><input type="button" value="=" class="igual" onclick="resolver('=')"></td>
                <td><input type="button" value="+" class="operador" onclick="escribir('+')"></td>
            </tr>
            <tr>
                <td colspan="4">
                    <button onclick="borrar()">C</button>
                </td>
            </tr>
        </table>
    </main>
